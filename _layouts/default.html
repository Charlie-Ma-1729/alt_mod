<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.url == "/" or page.url == "/index.html" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body id="top">
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button id="theme-toggle" type="button" aria-label="切換淺色或深色主題"></button>
    </div>
  </header>
  <main class="wrap">
    {% if page.url != "/" and page.url != "/index.html" %}
    <a class="btn-back" href="{{ '/' | relative_url }}"><span aria-hidden="true">←</span> 返回目錄</a>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {{ content }}
    {% if page.url != "/" and page.url != "/index.html" %}
    <nav class="page-end">
      <a class="btn-back" href="{{ '/' | relative_url }}"><span aria-hidden="true">←</span> 返回目錄</a>
      <a class="btn-back" href="#top"><span aria-hidden="true">↑</span> 回到頂端</a>
    </nav>
    {% endif %}
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      function current() {
        var t = root.getAttribute('data-theme');
        if (t) return t;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function label() { btn.textContent = current() === 'dark' ? '切換淺色' : '切換深色'; }
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
